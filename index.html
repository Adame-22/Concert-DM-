<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13161a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Sono Sim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Permanent+Marker&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-mode="concert" data-phase="prep">
<header class="topbar">
  <div class="brand">
    <span class="tape brand-tape">SONO SIM</span>
    <span class="brand-sub">Apprendre la sono en jouant</span>
  </div>
  <nav class="tabs" role="tablist" aria-label="Sections">
    <button data-view="parcours" role="tab" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 8l10 5 10-5-10-5z"/><path d="M6 10.5V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-5.5" fill="none" stroke-width="2"/></svg><span>Apprendre</span></button>
    <button data-view="quiz" role="tab" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg><span>Quiz</span></button>
    <button data-view="cablage" role="tab" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="7" width="14" height="8" rx="2.5"/><rect x="8" y="2" width="2.4" height="6" rx="1.2"/><rect x="13.6" y="2" width="2.4" height="6" rx="1.2"/><path d="M10.8 14.5h2.4v3.2a2.3 2.3 0 0 0 2.3 2.3H18v2.4h-2.5a4.7 4.7 0 0 1-4.7-4.7z"/></svg><span>Câblage</span></button>
    <button data-view="concert" class="on" role="tab" aria-selected="true"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="4" height="16" rx="1.5"/><rect x="10" y="4" width="4" height="16" rx="1.5"/><rect x="17" y="4" width="4" height="16" rx="1.5"/><rect x="2" y="13" width="6" height="3" rx="1" fill="#13161a"/><rect x="9" y="8" width="6" height="3" rx="1" fill="#13161a"/><rect x="16" y="11" width="6" height="3" rx="1" fill="#13161a"/></svg><span>Concert</span></button>
    <button data-view="atelier" role="tab" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4.5"/><rect x="10.5" y="12" width="3" height="9" rx="1.5"/></svg><span>Atelier</span></button>
    <button data-view="fiches" role="tab" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h10l4 4v14H5z"/><path d="M8 11h8M8 15h8M8 7h5" fill="none" stroke="#13161a" stroke-width="1.8"/></svg><span>Fiches</span></button>
  </nav>
  <div class="top-tools">
    <button id="level-chip" class="level-chip" title="Ton niveau"></button>
    <label class="switch" title="Mode apprentissage : analyseur, conseils et zones cibles visibles">
      <input type="checkbox" id="opt-help" checked>
      <span class="switch-track" aria-hidden="true"></span>
      <span class="switch-label">Aide</span>
    </label>
    <button id="btn-sound" class="btn-sound" aria-pressed="false">Activer le son</button>
    <input type="range" id="vol" min="0" max="1" step="0.05" value="0.5" aria-label="Volume des sons du simulateur">
  </div>
</header>

<main>
  <section id="view-parcours" class="view-parcours" hidden></section>

  <section id="view-sim" class="view-sim">
    <div class="phone-note">
      <p>Le concert complet se joue mieux sur ordinateur ou tablette, téléphone à l’horizontale au minimum. Sur téléphone, commence par les leçons.</p>
      <button id="go-parcours" class="primary">Apprendre</button>
    </div>
    <div class="sim-top">
      <div class="stage-wrap">
        <div class="stage-head">
          <div class="scene-id">
            <span id="phase-pill" class="pill">Préparation</span>
            <div class="scene-names">
              <h1 id="scene-title">Mot d’accueil</h1>
              <span id="scene-sub" class="scene-sub"></span>
            </div>
            <label class="sr-only" for="scene-select">Choisir le plateau</label>
            <select id="scene-select" class="scene-select"></select>
          </div>
          <div class="hud">
            <button id="btn-tour" class="hud-btn" title="Visite guidée de l’écran"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke-width="2"/><path d="M10 8l6 4-6 4z"/></svg><span>Visite</span></button>
            <button id="btn-explain" class="hud-btn explain-btn" aria-pressed="false" title="Explique-moi : touche un élément pour savoir à quoi il sert"><b>?</b><span>Explique-moi</span></button>
            <div class="view-toggle" role="group" aria-label="Vue de la scène">
              <button data-sv="salle" class="on" aria-pressed="true">Vue salle</button>
              <button data-sv="plan" aria-pressed="false">Plan</button>
            </div>
            <span id="mood" class="mood" data-mood="empty" title="Réaction du public">Salle vide</span>
            <div id="larsen-led" class="larsen-led" title="Témoin de larsen"><i></i>LARSEN</div>
            <div id="spl" class="spl" title="Sonomètre à la régie (niveau moyen au public)"><span id="spl-val">—</span><small>dB</small></div>
            <span id="show-time" class="show-time"></span>
            <button id="btn-phase" class="primary">Lever le rideau</button>
          </div>
        </div>
        <div id="show-progress" class="show-progress" hidden><i></i></div>
        <div id="cue-bar" class="cue-bar" aria-label="Conducteur du morceau" hidden></div>
        <div class="stage-box">
          <canvas id="salle" class="salle" role="img" aria-label="La scène vue depuis la régie : musiciens, micros, retours et public"></canvas>
          <svg id="stage" class="stage" role="application" aria-label="Plan de scène vu de dessus" hidden></svg>
          <div id="armed-hint" class="armed-hint" hidden><span id="armed-text"></span><button id="armed-cancel" class="btn-text">Annuler</button></div>
          <div id="toasts" class="toasts" aria-live="polite"></div>
          <div id="inspector" class="inspector" hidden></div>
        </div>
      </div>
      <aside class="side">
        <div class="side-tabs" role="tablist" aria-label="Panneau">
          <button data-tab="scene" class="on" role="tab" aria-selected="true">Scène</button>
          <button data-tab="valise" role="tab" aria-selected="false">Valise</button>
          <button data-tab="patch" role="tab" aria-selected="false">Patch</button>
          <button data-tab="tranche" role="tab" aria-selected="false">Tranche</button>
          <button data-tab="analyse" role="tab" aria-selected="false">Analyse</button>
        </div>
        <div id="side-body" class="side-body"></div>
      </aside>
    </div>
    <div id="console" class="console" aria-label="Console de mixage"></div>
  </section>

  <section id="view-quiz" class="view-quiz" hidden></section>
  <section id="view-cablage" class="view-cablage" hidden></section>
  <section id="view-fiches" class="view-learn" hidden></section>
</main>

<div id="geq-sheet" class="sheet" hidden></div>
<div id="modal" class="modal" hidden><div id="modal-box" class="modal-box" role="dialog" aria-modal="true"></div></div>

<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/state.js"></script>
<script src="js/audio.js"></script>
<script src="js/music.js"></script>
<script src="js/ui.js"></script>
<script src="js/stage.js"></script>
<script src="js/salle.js"></script>
<script src="js/parcours.js"></script>
<script src="js/mixer.js"></script>
<script src="js/learn.js"></script>
<script src="js/questions.js"></script>
<script src="js/quiz.js"></script>
<script src="js/coach.js"></script>
<script src="js/cablage.js"></script>
<script src="js/game.js"></script>
</body>
</html>
